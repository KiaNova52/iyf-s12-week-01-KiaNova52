
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Kelvin Kiarie</title>
</head>
<body>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Send Me a Message</h2>
            <p>Use the form below to get in touch with me.</p>

            <form action="#" method="get">
                <fieldset>
                    <legend>Your Contact Details</legend>

                    <label for="full-name">Full Name:</label>
                    <input
                        type="text"
                        id="full-name"
                        name="full-name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                    <br><br>

                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                    <br><br>

                    <label for="phone">Phone Number (optional):</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                    >
                </fieldset>

                <br>

                <fieldset>
                    <legend>Your Message</legend>

                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject" required>
                        <option value="">Choose a subject</option>
                        <option value="web-development">Web Development</option>
                        <option value="collaboration">Collaboration</option>
                        <option value="general">General Inquiry</option>
                    </select>
                    <br><br>

                    <label for="message">Message (minimum 50 characters):</label>
                    <br>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message here..."
                        minlength="50"
                        rows="6"
                        cols="40"
                        required
                    ></textarea>
                    <br><br>

                    <input
                        type="checkbox"
                        id="newsletter"
                        name="newsletter"
                        value="yes"
                    >
                    <label for="newsletter">Subscribe to my newsletter</label>
                </fieldset>

                <br>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>
            Email:
            <a href="mailto:kelvinkiarie466@gmail.com">kelvinkiarie466@gmail.com</a>
        </p>
        <p>&copy; 2026 Kelvin Kiarie</p>
    </footer>

</body>
</html>
