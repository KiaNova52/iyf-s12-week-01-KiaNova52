<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Site</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; color: #333; }
        header { background: #2c3e50; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.4rem; }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.5rem; }
        nav a { color: #fff; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { display: flex; gap: 2rem; padding: 2rem; }
        article { flex: 2; }
        aside { flex: 1; background: #f4f4f4; padding: 1rem; border-radius: 8px; }
        footer { background: #2c3e50; color: #fff; text-align: center; padding: 1rem; }
        footer p { margin: 0; }
    </style>
</head>
<body>

    <!-- Header: site branding + primary navigation -->
    <header>
        <h1>My Site</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main content area -->
    <main>
        <!-- Self-contained article -->
        <article>
            <h2>Welcome to My Site</h2>
            <p>This is my first post.</p>
            <p>This is my second post.</p>
        </article>

        <!-- Sidebar content, related to the main content -->
        <aside>
            <h2>Recent Posts</h2>
            <ul>
                <li>My first post</li>
                <li>My second post</li>
            </ul>
        </aside>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026</p>
    </footer>

</body>
</html>
